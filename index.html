<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio Solidário - Início</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-hands-helping"></i> Bem-vindo à nossa ONG</h1>
        <nav>
            <a href="index.html"><i class="fas fa-home"></i> Início</a> |
            <a href="projetos.html"><i class="fas fa-project-diagram"></i> Projetos</a> |
            <a href="cadastro.html"><i class="fas fa-user-plus"></i> Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Transformando Vidas Juntos</h2>
            <p>Conheça nossas iniciativas e faça parte da nossa rede de apoio solidário.</p>
        </section>

        <!-- Secção com classe CSS externa -->
        <section class="section-spacing">
            <h3>Nossos Projetos</h3>
            <div id="projetos-container"></div>
        </section>

        <!-- Secção com classe CSS externa -->
        <section class="section-spacing">
            <h3>Faça o seu Cadastro</h3>
            <form>
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." class="form-input"><br>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Enviar
                </button>
            </form>
        </section>
    </main>

    <!-- Scripts Modularizados -->
    <script src="js/script.js" defer></script>
    <script src="js/form-validation.js" defer></script>
</body>
</html>
